<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar prenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <section class="card shadow-sm mx-auto" style="max-width: 720px;"><div class="card-body">
        <h1 class="h3 mb-4">Editar prenda</h1>
        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-md-6"><label for="nombre" class="form-label">Nombre</label><input id="nombre" name="nombre" value="{{ prenda.nombre }}" class="form-control" required></div>
            <div class="col-md-6"><label for="color" class="form-label">Color</label><input id="color" name="color" value="{{ prenda.color }}" class="form-control" required></div>
            <div class="col-md-4"><label for="estado_limpieza" class="form-label">Estado</label><select id="estado_limpieza" name="estado_limpieza" class="form-select"><option value="limpio" {% if prenda.estado_limpieza == 'limpio' %}selected{% endif %}>Limpio</option><option value="sucio" {% if prenda.estado_limpieza == 'sucio' %}selected{% endif %}>Sucio</option></select></div>
            <div class="col-md-4"><label for="formalidad_prenda" class="form-label">Formalidad de la prenda</label><input id="formalidad_prenda" name="formalidad_prenda" type="number" min="1" max="10" value="{{ prenda.formalidad_prenda }}" class="form-control" required></div>
            <div class="col-md-4"><label for="formalidad_ocasion" class="form-label">Formalidad de la ocasión</label><input id="formalidad_ocasion" name="formalidad_ocasion" type="number" min="1" max="10" value="{{ prenda.formalidad_ocasion }}" class="form-control" required></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Guardar cambios</button> <a href="{% url 'resumen' %}" class="btn btn-secondary">Cancelar</a></div>
        </form>
    </div></section>
</main>
</body>
</html>
