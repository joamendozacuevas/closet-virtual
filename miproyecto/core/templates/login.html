<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Clóset Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <section class="card shadow-sm mx-auto" style="max-width: 420px">
        <div class="card-body p-4">
            <h1 class="h3 mb-4">Iniciar sesión</h1>
            {% if messages %}{% for message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label for="username" class="form-label">Usuario</label><input id="username" name="username" class="form-control" required autofocus></div>
                <div class="mb-3"><label for="password" class="form-label">Contraseña</label><input id="password" name="password" type="password" class="form-control" required></div>
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                <button class="btn btn-primary w-100" type="submit">Ingresar</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
