<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar eliminación | Clóset Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <section class="card shadow-sm mx-auto" style="max-width: 560px"><div class="card-body p-4">
        <h1 class="h3 text-danger">¿Eliminar prenda?</h1>
        <p>Vas a eliminar <strong>{{ prenda.nombre }}</strong>. La prenda no aparecerá en el inventario, pero se conservará para trazabilidad.</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Sí, eliminar</button>
            <a class="btn btn-secondary" href="{% url 'lista_prendas' %}">Cancelar</a>
        </form>
    </div></section>
</main>
</body>
</html>
