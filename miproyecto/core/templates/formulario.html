<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }} | Clóset Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4"><section class="card shadow-sm mx-auto" style="max-width: 640px"><div class="card-body p-4">
    <h1 class="h3 mb-4">{{ titulo }}</h1>
    <form method="post" class="row g-3">
        {% csrf_token %}
        {% for field in form %}
            <div class="{% if field.name == 'nombre' or field.name == 'color' %}col-md-6{% elif field.name == 'tipo' or field.name == 'estado' %}col-md-4{% else %}col-md-2{% endif %}">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
            </div>
        {% endfor %}
        <div class="col-12"><button class="btn btn-primary" type="submit">Guardar</button> <a class="btn btn-secondary" href="{% url 'lista_prendas' %}">Cancelar</a></div>
    </form>
</div></section></main>
</body>
</html>
