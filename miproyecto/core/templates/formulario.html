<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }} | Registros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4"><section class="card shadow-sm mx-auto" style="max-width: 640px"><div class="card-body p-4">
    <h1 class="h3 mb-4">{{ titulo }}</h1>
    {% if messages %}{% for message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post" class="row g-3">
        {% csrf_token %}
        <div class="col-12"><label for="nombre" class="form-label">Nombre</label><input id="nombre" name="nombre" value="{{ registro.nombre|default:'' }}" class="form-control" required></div>
        <div class="col-md-6"><label for="cantidad" class="form-label">Cantidad</label><input id="cantidad" name="cantidad" type="number" step="1" value="{{ registro.cantidad|default:'' }}" class="form-control" required></div>
        <div class="col-md-6"><label for="estado" class="form-label">Estado</label><select id="estado" name="estado" class="form-select" required><option value="al dia" {% if registro.estado == 'al dia' %}selected{% endif %}>Al día</option><option value="moroso" {% if registro.estado == 'moroso' %}selected{% endif %}>Moroso</option></select></div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Guardar</button> <a class="btn btn-secondary" href="{% url 'lista' %}">Cancelar</a></div>
    </form>
</div></section></main>
</body>
</html>
